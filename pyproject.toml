[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tubby-downloader"
version = "0.8.1"
description = "Local media transcription and intelligence with Ollama, plus media downloading."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
authors = [{ name = "Kelvin" }]
dependencies = [
    "customtkinter>=5.2.2",
    "faster-whisper>=1.2.1,<2",
    "reportlab[shaping]>=5.0.0",
    "yt-dlp>=2024.12.13",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11"]
test = ["pypdf>=5.4", "ruff>=0.11"]

[project.scripts]
tubby = "tubby.cli:main"
tubby-gui = "tubby.gui:main"

[tool.setuptools.packages.find]
include = ["tubby*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["legacy"]
